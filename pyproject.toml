[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tiktok-viewbot"
version = "0.1.0"
description = "Paste a TikTok link, pick a number of views, and let the bot do its thing."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Alex" }]
dependencies = ["requests>=2.32"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
viewbot = "tiktok_viewbot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tiktok_viewbot"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
